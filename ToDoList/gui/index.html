<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>TODO LIST</h1>
        <form id="add-form">
            <input type="text" id="task-input" placeholder="Enter the task you want to add" autocomplete="off" required>
            <button type="submit">Add a task</button>
        </form>
        <div id="task-list"></div>
        <button id="clear-btn">Clear all</button>
        <p id="empty-msg">No tasks yet. Add one above!</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
